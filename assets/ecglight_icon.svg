<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Gradients -->
    <linearGradient id="iconBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090E17" />
    </linearGradient>

    <linearGradient id="iconBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E63946" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <linearGradient id="iconPulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E63946" />
      <stop offset="25%" stop-color="#FF5964" />
      <stop offset="55%" stop-color="#FF9F1C" />
      <stop offset="80%" stop-color="#2EC4B6" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <linearGradient id="iconBoltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE600" />
      <stop offset="45%" stop-color="#FF7B00" />
      <stop offset="100%" stop-color="#E63946" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="iconGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="iconDropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="iconGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35" />
      <path d="M 8 0 L 8 32 M 16 0 L 16 32 M 24 0 L 24 32 M 0 8 L 32 8 M 0 16 L 32 16 M 0 24 L 32 24" fill="none" stroke="#1E293B" stroke-width="0.35" stroke-opacity="0.5" />
    </pattern>
  </defs>

  <!-- Container Rounded Card -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#iconBgGrad)" stroke="url(#iconBorderGrad)" stroke-width="6" filter="url(#iconDropShadow)" />

  <!-- ECG Grid Layer -->
  <rect x="22" y="22" width="468" height="468" rx="94" fill="url(#iconGrid)" opacity="0.8" />

  <!-- Radial Glow Behind Waveform -->
  <circle cx="256" cy="256" r="160" fill="#E63946" opacity="0.14" filter="url(#iconGlow)" />
  <circle cx="256" cy="256" r="100" fill="#00F2FE" opacity="0.1" filter="url(#iconGlow)" />

  <!-- Decorative Target Crosshairs -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.5" />

  <!-- ECG Signal Trace (P-Q-R-S-T) -->
  <path d="M 45 256 L 115 256 L 138 220 L 162 290 L 185 256 L 215 256 L 240 85 L 275 425 L 305 256 L 335 256 L 360 205 L 388 275 L 405 256 L 467 256"
        fill="none" stroke="url(#iconPulseGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#iconGlow)" />

  <!-- Overlaid Lightning Bolt Crest -->
  <path d="M 285 95 L 225 255 L 268 255 L 230 405 L 330 230 L 280 230 Z"
        fill="url(#boltGrad)" stroke="#FFFFFF" stroke-width="2.5" filter="url(#iconGlow)" opacity="0.95" />

  <!-- Precision Measurement Nodes -->
  <circle cx="240" cy="85" r="7" fill="#FFFFFF" filter="url(#iconGlow)" />
  <circle cx="275" cy="425" r="6.5" fill="#00F2FE" filter="url(#iconGlow)" />
  <circle cx="138" cy="220" r="4" fill="#FF5964" />
  <circle cx="360" cy="205" r="4" fill="#2EC4B6" />

  <!-- Sub-label in badge footer -->
  <rect x="146" y="420" width="220" height="38" rx="19" fill="#0B132B" stroke="url(#iconBorderGrad)" stroke-width="1.5" />
  <text x="256" y="445" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="16" fill="#F8FAFC" letter-spacing="2" text-anchor="middle">
    ECG<tspan fill="#E63946">LIGHT</tspan>
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>

    <linearGradient id="primaryPulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E63946" />
      <stop offset="25%" stop-color="#FF5964" />
      <stop offset="50%" stop-color="#FF9F1C" />
      <stop offset="75%" stop-color="#2EC4B6" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE600" />
      <stop offset="40%" stop-color="#FF7B00" />
      <stop offset="100%" stop-color="#E63946" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FFD166" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E63946" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E63946" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.6" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="ecgGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.4" />
      <path d="M 8 0 L 8 40 M 16 0 L 16 40 M 24 0 L 24 40 M 32 0 L 32 40 M 0 8 L 40 8 M 0 16 L 40 16 M 0 24 L 40 24 M 0 32 L 40 32" fill="none" stroke="#1E293B" stroke-width="0.35" stroke-opacity="0.6" />
    </pattern>
  </defs>

  <!-- Background Card -->
  <rect x="10" y="10" width="1180" height="340" rx="24" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" filter="url(#softShadow)" />

  <!-- ECG Precision Grid Overlay -->
  <rect x="12" y="12" width="1176" height="336" rx="22" fill="url(#ecgGrid)" opacity="0.85" />

  <!-- Ambient Glow Blobs -->
  <circle cx="220" cy="180" r="140" fill="#E63946" opacity="0.12" filter="url(#glow)" />
  <circle cx="980" cy="180" r="150" fill="#00F2FE" opacity="0.1" filter="url(#glow)" />

  <!-- ==================== LEFT: LOGO EMBLEM ==================== -->
  <g transform="translate(45, 45)">
    <!-- Emblem Outer Hex/Circle Shield -->
    <rect x="0" y="0" width="270" height="270" rx="36" fill="#131D31" stroke="url(#borderGrad)" stroke-width="2.5" />
    
    <!-- Shield Internal Grid -->
    <rect x="4" y="4" width="262" height="262" rx="32" fill="url(#ecgGrid)" opacity="0.9" />

    <!-- Pulse Waveform in Emblem -->
    <path d="M 20 135 L 55 135 L 68 115 L 82 155 L 95 135 L 115 135 L 128 40 L 145 225 L 162 135 L 178 135 L 192 105 L 208 145 L 218 135 L 250 135"
          fill="none" stroke="url(#primaryPulseGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

    <!-- Stylized Lightning Bolt Crest Overlaid on Peak -->
    <path d="M 148 45 L 118 132 L 142 132 L 122 215 L 172 118 L 144 118 Z"
          fill="url(#boltGrad)" stroke="#FFF" stroke-width="1.2" filter="url(#glow)" opacity="0.95" />

    <!-- Precision Spark Points -->
    <circle cx="128" cy="40" r="4.5" fill="#FFFFFF" filter="url(#glow)" />
    <circle cx="145" cy="225" r="4" fill="#00F2FE" filter="url(#glow)" />
    <circle cx="172" cy="118" r="3" fill="#FFE600" />
  </g>

  <!-- ==================== RIGHT: BRANDING & DETAILS ==================== -->
  <!-- Main Title -->
  <g transform="translate(355, 105)">
    <text x="0" y="0" font-family="'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="54" letter-spacing="-1.5" fill="url(#textGrad)">
      ECG<tspan fill="#E63946">Light</tspan>
    </text>
    
    <!-- Lightning Icon Beside Title -->
    <path d="M 255 -38 L 238 2 L 252 2 L 240 40 L 272 -12 L 255 -12 Z" fill="url(#boltGrad)" filter="url(#glow)" />
  </g>

  <!-- Subtitle -->
  <text x="355" y="145" font-family="'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="19" fill="#94A3B8" letter-spacing="0.2">
    Compute-Light Framework for Paper ECG Digitization &amp; Myocardial Infarction Screening
  </text>

  <!-- Author Line -->
  <g transform="translate(355, 185)">
    <rect x="0" y="-4" width="460" height="32" rx="8" fill="#0B132B" stroke="#E63946" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="16" cy="12" r="5" fill="#E63946" />
    <text x="30" y="17" font-family="'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13.5" fill="#F1F5F9">
      Author: <tspan fill="#FF5964">Shreyasvi Natraj</tspan>
      <tspan fill="#64748B"> | </tspan>
      <tspan fill="#38BDF8">ETH Zürich</tspan>
      <tspan fill="#64748B"> • </tspan>
      <tspan fill="#2EC4B6">SCAI Lab</tspan>
    </text>
  </g>


  <!-- Feature Pill Badges -->
  <g transform="translate(355, 240)">
    <!-- Badge 1: 500 Hz -->
    <rect x="0" y="0" width="165" height="36" rx="10" fill="url(#badgeGrad)" stroke="#E63946" stroke-width="1" stroke-opacity="0.6" />
    <text x="82.5" y="23" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="#FFE4E6" text-anchor="middle">⚡ 500 Hz Digitization</text>

    <!-- Badge 2: Multi-Scale YOLOv11 -->
    <rect x="180" y="0" width="190" height="36" rx="10" fill="url(#badgeGrad)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.6" />
    <text x="275" y="23" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="#E0F2FE" text-anchor="middle">📷 YOLOv11 Multi-Scale</text>

    <!-- Badge 3: 95.5% MI Screening -->
    <rect x="385" y="0" width="180" height="36" rx="10" fill="url(#badgeGrad)" stroke="#2EC4B6" stroke-width="1" stroke-opacity="0.6" />
    <text x="475" y="23" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="#CCFBF1" text-anchor="middle">❤️ 95.5% MI Accuracy</text>

    <!-- Badge 4: CPU Ready -->
    <rect x="580" y="0" width="190" height="36" rx="10" fill="url(#badgeGrad)" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.6" />
    <text x="675" y="23" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="#FEF3C7" text-anchor="middle">⏱️ &lt;30s CPU Inference</text>
  </g>

  <!-- Bottom Right Minimal Pulse Line Decorative Element -->
  <path d="M 980 305 L 1020 305 L 1030 290 L 1040 320 L 1050 305 L 1060 305 L 1070 270 L 1080 340 L 1090 305 L 1150 305"
        fill="none" stroke="url(#primaryPulseGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
</svg>
